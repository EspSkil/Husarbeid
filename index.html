<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2f57" />
  <title>Husarbeid</title>

  <style>
    :root{
      --navy:#0f2f57; --navy2:#163e6b; --blue:#eaf2fb; --bg:#f4f7fb;
      --card:#fff; --text:#172033; --muted:#6f7b8d; --line:#dfe6ef;
      --green:#2e8b57; --green-soft:#e9f7ef; --grey:#eef1f5;
      --red:#a24b37; --shadow:0 6px 20px rgba(15,47,87,.08); --r:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .app{width:min(760px,100%);margin:auto;min-height:100vh}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 14px 12px}
    .brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    .brand{display:flex;align-items:center;gap:10px}
    .brand-icon{width:38px;height:38px;border-radius:12px;background:var(--navy);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:var(--shadow)}
    .brand h1{font-size:20px;margin:0;color:var(--navy)}
    .status-dot{width:9px;height:9px;border-radius:50%;background:#aab3c0}
    .status-dot.online{background:var(--green)} .status-dot.offline{background:#cc6b3f}
    .person-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .person-tab{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:12px;padding:10px 12px;font-weight:800}
    .person-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    main{padding:14px}
    .salary-card{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:20px;padding:16px;box-shadow:0 10px 28px rgba(15,47,87,.18);margin-bottom:10px}
    .salary-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
    .salary-title{font-size:13px;opacity:.82;font-weight:700;text-transform:uppercase}
    .salary-big{font-size:32px;line-height:1;font-weight:900;margin-top:4px}
    .salary-sub{font-size:12px;opacity:.8;text-align:right;line-height:1.4}
    .salary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .metric{background:rgba(255,255,255,.11);border-radius:12px;padding:10px 9px}
    .metric-label{font-size:11px;opacity:.78;margin-bottom:4px}
    .metric-value{font-size:16px;font-weight:800;white-space:nowrap}
    .admin-open{width:100%;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:13px;padding:10px 12px;font-weight:900;margin-bottom:12px;box-shadow:var(--shadow)}
    .range-wrap{background:#fff;border:1px solid var(--line);border-radius:15px;padding:6px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;margin-bottom:14px;box-shadow:var(--shadow)}
    .range-btn{border:0;border-radius:10px;padding:9px 7px;background:transparent;color:var(--muted);font-size:12px;font-weight:800}
    .range-btn.active{background:var(--blue);color:var(--navy)}
    .week-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
    .week-card.past{background:#f1f3f6;box-shadow:none}
    .week-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
    .week-number{font-weight:900;color:var(--navy);font-size:15px}
    .week-dates{margin-top:2px;color:var(--muted);font-size:12px}
    .week-badge{border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;background:var(--grey);color:#6f7782}
    .week-badge.complete{background:var(--green-soft);color:var(--green)}
    .tasks{padding:2px 12px 10px}
    .task-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid #edf0f4}
    .task-row:last-child{border-bottom:0}
    .task-name{font-size:14px;font-weight:750;line-height:1.25}
    .task-meta{margin-top:4px;font-size:11px;color:var(--muted);line-height:1.3}
    .task-row.done .task-name{text-decoration:line-through;color:#6f7782}
    .task-row.done{opacity:.82}
    .task-action{border:0;border-radius:10px;min-width:78px;padding:9px 10px;font-size:12px;font-weight:900;background:var(--navy);color:#fff}
    .task-action.done{background:var(--green-soft);color:var(--green);border:1px solid #ccead8}
    .task-action.future,.task-action:disabled{background:#e5e8ed;color:#9aa2ad;border:1px solid #d9dde3;cursor:not-allowed}
    .money-note{margin:0 12px 12px;border-radius:11px;padding:9px 10px;font-size:12px;font-weight:700;background:#f4f7fb;color:var(--muted)}
    .money-note.ok{background:var(--green-soft);color:var(--green)}
    .empty,.error-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;color:var(--muted);text-align:center;box-shadow:var(--shadow)}
    .footer{padding:4px 14px 24px;text-align:center;font-size:11px;color:#9aa3af}
    .loading-overlay,.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(15,47,87,.28);display:none;align-items:center;justify-content:center;padding:18px}
    .loading-overlay.show,.modal-backdrop.show{display:flex}
    .loading-box{background:#fff;border-radius:14px;padding:14px 18px;font-weight:800;color:var(--navy);box-shadow:0 10px 35px rgba(15,47,87,.18)}
    .modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:16px;box-shadow:0 18px 50px rgba(15,47,87,.28)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .modal-head h2{margin:0;color:var(--navy);font-size:20px}
    .close-btn{border:0;background:var(--grey);width:34px;height:34px;border-radius:10px;font-weight:900}
    .pin-box{display:grid;gap:10px}
    .pin-input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:18px;text-align:center;letter-spacing:4px}
    .primary-btn{border:0;border-radius:12px;padding:11px 13px;background:var(--navy);color:#fff;font-weight:900}
    .admin-card{border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px}
    .admin-card h3{margin:0 0 8px;color:var(--navy)}
    .admin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}
    .admin-mini{background:#f5f7fa;border-radius:10px;padding:8px}
    .admin-mini span{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}
    .admin-mini strong{font-size:14px}
    .pay-btn{width:100%;border:0;border-radius:11px;padding:10px;background:var(--green);color:#fff;font-weight:900}
    .pay-btn:disabled{background:#dfe4e9;color:#929aa5}
    .admin-msg{font-size:12px;color:var(--red);margin-top:6px;text-align:center}
  </style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <div class="brandrow">
      <div class="brand">
        <div class="brand-icon">✓</div>
        <h1>Husarbeid</h1>
      </div>
      <div id="statusDot" class="status-dot"></div>
    </div>
    <div id="personTabs" class="person-tabs"></div>
  </header>

  <main>
    <section id="salaryCard" class="salary-card"></section>
    <button id="adminOpen" class="admin-open">💳 Utbetalinger</button>

    <div class="range-wrap">
      <button class="range-btn active" data-range="2">Denne + neste uke</button>
      <button class="range-btn" data-range="4">Neste 4 uker</button>
      <button class="range-btn" data-range="all">Hele perioden</button>
    </div>

    <div id="content"></div>
  </main>

  <div id="footer" class="footer"></div>
</div>

<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-box">Lagrer…</div>
</div>

<div id="adminBackdrop" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h2>Utbetalinger</h2>
      <button id="adminClose" class="close-btn">×</button>
    </div>
    <div id="adminContent"></div>
  </div>
</div>

<script>
const API_URL =
  'https://script.google.com/macros/s/AKfycbzm3LKUvrT8UC0QIN_NNN-_NE4uIRxtmKYRG9_m8Px0E-wbZjuedTe9OqkatYRzpcqU/exec';

const CACHE_KEY = 'husarbeid_app_cache_v2';
const PERSON_KEY = 'husarbeid_selected_person_v1';

let appData = null;
let selectedPerson = localStorage.getItem(PERSON_KEY) || '';
let selectedRange = '2';
let parentPinSession = '';

document.addEventListener('DOMContentLoaded', () => {
  bindRangeButtons();
  bindAdmin();
  loadCachedData();
  fetchFreshData();
});

function loadCachedData() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.people) return;
    appData = parsed;
    if (!selectedPerson && appData.people.length) selectedPerson = appData.people[0].person;
    render();
  } catch (err) {}
}

function saveCache(data) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (err) {}
}

async function fetchFreshData() {
  try {
    const response = await fetch(API_URL + '?action=data&t=' + Date.now(), {
      method: 'GET',
      cache: 'no-store'
    });
    const data = await response.json();
    if (!data.ok) throw new Error(data.error || 'Ukjent feil');
    appData = data;
    saveCache(data);

    if (!selectedPerson || !appData.people.some(p => p.person === selectedPerson)) {
      selectedPerson = appData.people[0]?.person || '';
    }

    setOnline(true);
    render();
  } catch (err) {
    console.error(err);
    setOnline(false);
    if (!appData) {
      document.getElementById('content').innerHTML =
        '<div class="error-box">Kunne ikke hente data akkurat nå.</div>';
    }
  }
}

function renderPersonTabs() {
  const el = document.getElementById('personTabs');
  el.innerHTML = (appData?.people || []).map(person => `
    <button class="person-tab ${person.person === selectedPerson ? 'active' : ''}"
      data-person="${escapeAttr(person.person)}">${escapeHtml(person.person)}</button>
  `).join('');

  el.querySelectorAll('.person-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedPerson = btn.dataset.person;
      localStorage.setItem(PERSON_KEY, selectedPerson);
      render();
    });
  });
}

function renderSalaryCard() {
  const el = document.getElementById('salaryCard');
  const person = appData.people.find(p => p.person === selectedPerson);
  if (!person) return;

  const info = getCurrentSalaryMonthInfo(person);

  el.innerHTML = `
    <div class="salary-head">
      <div>
        <div class="salary-title">${capitalize(info.monthName)} · opptjent hittil</div>
        <div class="salary-big">${formatKr(info.earned)}</div>
      </div>
      <div class="salary-sub">Månedslønn<br><strong>${formatKr(person.totalMonthlySalary)}</strong></div>
    </div>
    <div class="salary-grid">
      <div class="metric"><div class="metric-label">Fra oppgaver</div><div class="metric-value">${formatKr(info.ordinaryEarned)}</div></div>
      <div class="metric"><div class="metric-label">Fast del</div><div class="metric-value">${formatKr(info.fixedEarned)}</div></div>
      <div class="metric"><div class="metric-label">Totalt til gode</div><div class="metric-value">${formatKr(info.outstanding)}</div></div>
    </div>
  `;
}

function getCurrentSalaryMonthInfo(person) {
  // Aktiv lønnsmåned bestemmes av mandagen i inneværende uke.
  const currentWeek = appData.weeks.find(
    w => w.year === appData.current.year && w.week === appData.current.week
  );

  const salaryMonthDate = currentWeek
    ? parseYmd(currentWeek.monday)
    : parseYmd(appData.today);

  const targetYear = salaryMonthDate.getFullYear();
  const targetMonth = salaryMonthDate.getMonth();
  const weeklyOrdinary = Number(person.ordinaryMonthlySalary || 0) / 4;

  // Hele uken tilhører måneden der mandagen ligger.
  const monthWeeks = appData.weeks.filter(week => {
    const monday = parseYmd(week.monday);
    return monday.getFullYear() === targetYear &&
           monday.getMonth() === targetMonth;
  });

  let ordinaryEarned = 0;
  monthWeeks.forEach(week => {
    const pw = week.persons.find(p => p.person === person.person);
    if (pw?.salaryComplete) ordinaryEarned += weeklyOrdinary;
  });

  const fixedEarned = Number(person.fixedMonthlySalary || 0);
  const monthEarned = ordinaryEarned + fixedEarned;

  // Total opptjening siden historikkstart.
  let totalOrdinaryEarned = 0;
  const earnedMonths = new Set();
  const currentMonday = currentWeek
    ? parseYmd(currentWeek.monday)
    : parseYmd(appData.today);

  appData.weeks.forEach(week => {
    const monday = parseYmd(week.monday);
    if (monday > currentMonday) return;

    const pw = week.persons.find(p => p.person === person.person);
    if (pw?.salaryComplete) totalOrdinaryEarned += weeklyOrdinary;

    const monthKey =
      `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}`;
    earnedMonths.add(monthKey);
  });

  const totalFixedEarned =
    Number(person.fixedMonthlySalary || 0) * earnedMonths.size;
  const totalEarned = totalOrdinaryEarned + totalFixedEarned;

  const totalPaid = (appData.payments || [])
    .filter(p => p.person === person.person)
    .reduce((sum, p) => sum + Number(p.amount || 0), 0);

  const monthPaid = (appData.payments || [])
    .filter(payment => {
      if (payment.person !== person.person) return false;
      const raw = payment.periodFrom || payment.date;
      if (!raw) return false;
      const d = parseYmd(raw);
      return d.getFullYear() === targetYear &&
             d.getMonth() === targetMonth;
    })
    .reduce((sum, p) => sum + Number(p.amount || 0), 0);

  const monthStart = new Date(targetYear, targetMonth, 1, 12);
  const monthEnd = new Date(targetYear, targetMonth + 1, 0, 12);

  return {
    monthName: new Intl.DateTimeFormat('nb-NO', { month:'long' })
      .format(salaryMonthDate),
    ordinaryEarned,
    fixedEarned,
    earned: monthEarned,
    paid: monthPaid,
    monthOutstanding: Math.max(0, monthEarned - monthPaid),
    outstanding: Math.max(0, totalEarned - totalPaid),
    totalEarned,
    totalPaid,
    periodFrom: toYmd(monthStart),
    periodTo: toYmd(monthEnd)
  };
}

function bindRangeButtons() {
  document.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedRange = btn.dataset.range;
      document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b === btn));
      renderWeeks();
    });
  });
}

function getVisibleWeeks() {
  const weeks = appData?.weeks || [];
  const currentIndex = weeks.findIndex(w => w.year === appData.current.year && w.week === appData.current.week);

  if (selectedRange === 'all') return weeks;
  if (currentIndex < 0) return weeks;
  if (selectedRange === '2') return weeks.slice(Math.max(0, currentIndex - 1), currentIndex + 2);
  if (selectedRange === '4') return weeks.slice(currentIndex, currentIndex + 4);
  return weeks;
}

function renderWeeks() {
  const el = document.getElementById('content');
  const weeks = getVisibleWeeks();

  if (!weeks.length) {
    el.innerHTML = '<div class="empty">Ingen uker å vise.</div>';
    return;
  }

  el.innerHTML = weeks.map(renderWeekCard).join('');

  el.querySelectorAll('[data-task-action]:not([disabled])').forEach(btn => {
    btn.addEventListener('click', async () => {
      await updateTaskStatus(
        Number(btn.dataset.year),
        Number(btn.dataset.week),
        selectedPerson,
        btn.dataset.taskId,
        btn.dataset.done !== 'true'
      );
    });
  });
}

function renderWeekCard(week) {
  const pw = week.persons.find(p => p.person === selectedPerson);
  if (!pw) return '';

  const isPast = isPastWeek(week);
  const isFuture = isFutureWeek(week);
  const weeklyValue = Number(pw.ordinaryMonthlySalary || 0) / 4;

  const tasksHtml = pw.tasks.map(task => {
    const meta = [];
    if (task.comment) meta.push(task.comment);
    if (!task.affectsSalary) meta.push('Påvirker ikke lønn');
    if (task.done && task.doneTimestamp) meta.push('Ferdig ' + formatDoneTime(task.doneTimestamp));
    if (isFuture) meta.push('Kan krysses av når uken starter');

    return `
      <div class="task-row ${task.done ? 'done' : ''}">
        <div>
          <div class="task-name">${task.done ? '✓ ' : ''}${escapeHtml(task.task)}</div>
          ${meta.length ? `<div class="task-meta">${meta.map(escapeHtml).join(' · ')}</div>` : ''}
        </div>
        <button
          class="task-action ${task.done ? 'done' : ''} ${isFuture ? 'future' : ''}"
          data-task-action
          data-year="${week.year}"
          data-week="${week.week}"
          data-task-id="${escapeAttr(task.taskId)}"
          data-done="${task.done}"
          ${isFuture ? 'disabled' : ''}>
          ${isFuture ? 'Senere' : (task.done ? 'Angre' : 'Ferdig')}
        </button>
      </div>
    `;
  }).join('');

  let note = '';
  if (isFuture) {
    note = `<div class="money-note">Fremtidig uke – oppgavene er synlige, men kan ikke markeres ferdig ennå.</div>`;
  } else if (pw.salaryComplete) {
    note = `<div class="money-note ok">✓ Ordinær ukesandel opptjent: ${formatKr(weeklyValue)}</div>`;
  } else {
    const missing = pw.tasks.filter(t => t.affectsSalary && !t.done).map(t => t.task);
    note = `<div class="money-note">${missing.length ? 'For å tjene ukesandelen mangler: ' + escapeHtml(missing.join(', ')) : 'Ingen lønnspåvirkende oppgaver.'}</div>`;
  }

  return `
    <section class="week-card ${isPast ? 'past' : ''}">
      <div class="week-head">
        <div>
          <div class="week-number">Uke ${week.week}</div>
          <div class="week-dates">${formatWeekRange(week.monday, week.sunday)}</div>
        </div>
        <div class="week-badge ${pw.salaryComplete && !isFuture ? 'complete' : ''}">
          ${isFuture ? 'Fremtidig' : (pw.salaryComplete ? 'Lønn opptjent' : (isPast ? 'Historikk' : 'Pågår'))}
        </div>
      </div>
      <div class="tasks">${tasksHtml}</div>
      ${note}
    </section>
  `;
}

async function updateTaskStatus(year, week, person, taskId, done) {
  showLoading(true);
  applyLocalTaskStatus(year, week, person, taskId, done);
  render();

  try {
    const data = await postApi({ action:'setTaskStatus', year, week, person, taskId, done });
    if (!data.ok) throw new Error(data.error || 'Kunne ikke lagre');
    setOnline(true);
    await fetchFreshData();
  } catch (err) {
    alert(err.message || 'Kunne ikke lagre.');
    await fetchFreshData();
  } finally {
    showLoading(false);
  }
}

function applyLocalTaskStatus(year, week, person, taskId, done) {
  const w = appData.weeks.find(x => x.year === year && x.week === week);
  const pw = w?.persons.find(p => p.person === person);
  const task = pw?.tasks.find(t => t.taskId === taskId);
  if (!task) return;

  task.done = done;
  task.doneTimestamp = done ? new Date().toISOString() : '';

  const salaryTasks = pw.tasks.filter(t => t.affectsSalary);
  pw.salaryComplete = salaryTasks.length > 0 && salaryTasks.every(t => t.done);

  const required = pw.tasks.filter(t => t.required);
  pw.weekComplete = required.length > 0 && required.every(t => t.done);

  saveCache(appData);
}

/**************** UTBETALINGER / FORELDRE ****************/
function bindAdmin() {
  document.getElementById('adminOpen').addEventListener('click', openAdmin);
  document.getElementById('adminClose').addEventListener('click', closeAdmin);
  document.getElementById('adminBackdrop').addEventListener('click', e => {
    if (e.target.id === 'adminBackdrop') closeAdmin();
  });
}

function openAdmin() {
  document.getElementById('adminBackdrop').classList.add('show');
  if (parentPinSession) renderAdminOverview();
  else renderPinForm();
}

function closeAdmin() {
  document.getElementById('adminBackdrop').classList.remove('show');
}

function renderPinForm(message='') {
  const el = document.getElementById('adminContent');
  el.innerHTML = `
    <div class="pin-box">
      <div style="text-align:center;color:var(--muted);font-size:13px">Skriv foreldre-PIN for å se og registrere utbetalinger.</div>
      <input id="pinInput" class="pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="PIN">
      <button id="pinSubmit" class="primary-btn">Åpne utbetalinger</button>
      ${message ? `<div class="admin-msg">${escapeHtml(message)}</div>` : ''}
    </div>
  `;
  document.getElementById('pinSubmit').addEventListener('click', verifyPinFromForm);
  document.getElementById('pinInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') verifyPinFromForm();
  });
}

async function verifyPinFromForm() {
  const pin = document.getElementById('pinInput').value;
  if (!pin) return;

  showLoading(true);
  try {
    const data = await postApi({ action:'verifyParentPin', pin });
    if (!data.ok) throw new Error(data.error || 'Feil PIN');
    parentPinSession = pin;
    renderAdminOverview();
  } catch (err) {
    parentPinSession = '';
    renderPinForm(err.message || 'Feil PIN');
  } finally {
    showLoading(false);
  }
}

function renderAdminOverview() {
  const el = document.getElementById('adminContent');

  el.innerHTML = appData.people.map(person => {
    const info = getCurrentSalaryMonthInfo(person);

    return `
      <div class="admin-card">
        <h3>${escapeHtml(person.person)}</h3>
        <div class="admin-grid">
          <div class="admin-mini"><span>Denne måneden</span><strong>${formatKr(info.earned)}</strong></div>
          <div class="admin-mini"><span>Totalt utbetalt</span><strong>${formatKr(info.totalPaid)}</strong></div>
          <div class="admin-mini"><span>Totalt til gode</span><strong>${formatKr(info.outstanding)}</strong></div>
        </div>
        <button class="pay-btn"
          data-pay-person="${escapeAttr(person.person)}"
          ${info.outstanding <= 0 ? 'disabled' : ''}>
          ${info.outstanding > 0 ? 'Marker ' + formatKr(info.outstanding) + ' som utbetalt' : 'Alt er gjort opp'}
        </button>
      </div>
    `;
  }).join('');

  el.querySelectorAll('[data-pay-person]:not([disabled])').forEach(btn => {
    btn.addEventListener('click', () => payOutstanding(btn.dataset.payPerson));
  });
}

async function payOutstanding(personName) {
  const person = appData.people.find(p => p.person === personName);
  if (!person) return;

  const info = getCurrentSalaryMonthInfo(person);
  if (info.outstanding <= 0) return;

  const ok = confirm(
    `Registrere ${formatKr(info.outstanding)} som utbetalt til ${personName}?`
  );
  if (!ok) return;

  showLoading(true);

  try {
    const data = await postApi({
      action:'addPayment',
      pin:parentPinSession,
      person:personName,
      amount:info.outstanding,
      date:toYmd(new Date()),
      periodFrom:info.periodFrom,
      periodTo:info.periodTo,
      comment:'Utbetalt via Husarbeid-app'
    });

    if (!data.ok) throw new Error(data.error || 'Kunne ikke registrere utbetaling.');

    await fetchFreshData();
    renderAdminOverview();

  } catch (err) {
    if (String(err.message || '').toLowerCase().includes('pin')) {
      parentPinSession = '';
      renderPinForm('PIN må oppgis på nytt.');
    } else {
      alert(err.message || 'Kunne ikke registrere utbetaling.');
    }
  } finally {
    showLoading(false);
  }
}

async function postApi(payload) {
  const response = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)
  });
  return response.json();
}

/**************** RENDER / HJELPERE ****************/
function render() {
  if (!appData) return;
  renderPersonTabs();
  renderSalaryCard();
  renderWeeks();
  renderFooter();
}

function renderFooter() {
  const generated = appData?.generatedAt ? new Date(appData.generatedAt) : null;
  document.getElementById('footer').textContent = generated
    ? 'Sist oppdatert ' + generated.toLocaleString('nb-NO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
    : '';
}

function setOnline(v) {
  const dot = document.getElementById('statusDot');
  dot.classList.toggle('online', v);
  dot.classList.toggle('offline', !v);
}

function showLoading(v) {
  document.getElementById('loadingOverlay').classList.toggle('show', v);
}

function parseYmd(value) {
  const [y,m,d] = String(value).slice(0,10).split('-').map(Number);
  return new Date(y,m-1,d,12);
}

function toYmd(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate()+days);
  return d;
}

function isPastWeek(week) {
  return parseYmd(week.sunday) < parseYmd(appData.today);
}

function isFutureWeek(week) {
  const currentMonday = appData.weeks.find(
    w => w.year === appData.current.year && w.week === appData.current.week
  )?.monday;

  if (!currentMonday) return false;
  return parseYmd(week.monday) > parseYmd(currentMonday);
}

function formatWeekRange(a,b) {
  const fmt = new Intl.DateTimeFormat('nb-NO',{day:'numeric',month:'short'});
  return `${fmt.format(parseYmd(a))} – ${fmt.format(parseYmd(b))}`;
}

function formatDoneTime(value) {
  if (!value) return '';
  const normalized = String(value).includes('T') ? String(value) : String(value).replace(' ','T');
  const date = new Date(normalized);
  if (isNaN(date.getTime())) return String(value);
  return date.toLocaleString('nb-NO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function formatKr(value) {
  const n = Number(value || 0);
  return new Intl.NumberFormat('nb-NO',{maximumFractionDigits:n % 1 === 0 ? 0 : 2}).format(n) + ' kr';
}

function capitalize(v) {
  return v ? v.charAt(0).toUpperCase()+v.slice(1) : '';
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#039;');
}

function escapeAttr(value) { return escapeHtml(value); }
</script>
