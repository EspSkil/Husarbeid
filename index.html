<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2f57" />
  <title>Husarbeid</title>
  <style>
    :root{--navy:#0f2f57;--navy2:#163e6b;--blueSoft:#eaf2fb;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6f7b8d;--line:#dfe6ef;--green:#2e8b57;--greenSoft:#e9f7ef;--shadow:0 6px 20px rgba(15,47,87,.08);--radius:18px}
    *{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif} body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)} button{font:inherit;-webkit-tap-highlight-color:transparent}.app{width:min(760px,100%);margin:0 auto;min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(223,230,239,.9);padding:calc(12px + env(safe-area-inset-top)) 14px 12px}.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.brand{display:flex;align-items:center;gap:10px}.brand-icon{width:38px;height:38px;border-radius:12px;background:var(--navy);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:var(--shadow)}.brand h1{font-size:20px;line-height:1.1;margin:0;color:var(--navy)}.status-dot{width:9px;height:9px;border-radius:50%;background:#aab3c0}.status-dot.online{background:#2e8b57}.status-dot.offline{background:#cc6b3f}.person-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.person-tab{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer}.person-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 4px 12px rgba(15,47,87,.18)} main{padding:14px}.salary-card{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:20px;padding:16px;box-shadow:0 10px 28px rgba(15,47,87,.18);margin-bottom:12px}.salary-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.salary-title{font-size:13px;opacity:.82;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.salary-big{font-size:32px;line-height:1;font-weight:900;margin-top:4px;letter-spacing:-1px}.salary-sub{font-size:12px;opacity:.78;text-align:right;line-height:1.4}.salary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.11);border-radius:12px;padding:10px 9px}.metric-label{font-size:11px;opacity:.78;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric-value{font-size:16px;font-weight:800;white-space:nowrap}.range-wrap{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:6px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;margin-bottom:14px;box-shadow:var(--shadow)}.range-btn{border:0;border-radius:10px;padding:9px 7px;background:transparent;color:var(--muted);font-size:12px;font-weight:800;cursor:pointer}.range-btn.active{background:var(--blueSoft);color:var(--navy)}.week-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}.week-card.past{background:#f1f3f6;border-color:#e0e4e9;box-shadow:none}.week-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}.week-number{font-weight:900;color:var(--navy);font-size:15px}.week-dates{margin-top:2px;color:var(--muted);font-size:12px}.week-badge{border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;background:#eef1f5;color:#6f7782}.week-badge.complete{background:var(--greenSoft);color:var(--green)}.tasks{padding:2px 12px 10px}.task-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid #edf0f4}.task-row:last-child{border-bottom:0}.task-main{min-width:0}.task-name{font-size:14px;font-weight:750;line-height:1.25}.task-meta{margin-top:4px;font-size:11px;color:var(--muted);line-height:1.3}.task-row.done .task-name{text-decoration:line-through;color:#6f7782}.task-row.done{opacity:.82}.task-action{border:0;border-radius:10px;min-width:78px;padding:9px 10px;font-size:12px;font-weight:900;cursor:pointer;background:var(--navy);color:#fff}.task-action.done{background:var(--greenSoft);color:var(--green);border:1px solid #ccead8}.money-note{margin:0 12px 12px;border-radius:11px;padding:9px 10px;font-size:12px;font-weight:700;line-height:1.35;background:#f4f7fb;color:var(--muted)}.money-note.ok{background:var(--greenSoft);color:var(--green)}.empty,.error-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;color:var(--muted);text-align:center;box-shadow:var(--shadow)}.error-box{color:#a24b37;background:#fff7f4;border-color:#f2d5cb}.footer{padding:4px 14px 24px;text-align:center;font-size:11px;color:#9aa3af}.loading-overlay{position:fixed;inset:0;z-index:100;background:rgba(15,47,87,.14);display:none;align-items:center;justify-content:center;padding:20px}.loading-overlay.show{display:flex}.loading-box{background:#fff;border-radius:14px;padding:14px 18px;font-weight:800;color:var(--navy);box-shadow:0 10px 35px rgba(15,47,87,.18)}
    @media (min-width:640px){main{padding:18px}.topbar{padding-left:18px;padding-right:18px}.task-name{font-size:15px}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brandrow"><div class="brand"><div class="brand-icon">✓</div><h1>Husarbeid</h1></div><div id="statusDot" class="status-dot" title="Tilkoblingsstatus"></div></div>
    <div id="personTabs" class="person-tabs"></div>
  </header>
  <main>
    <section id="salaryCard" class="salary-card"></section>
    <div class="range-wrap">
      <button class="range-btn active" data-range="2">Denne + neste uke</button>
      <button class="range-btn" data-range="4">Neste 4 uker</button>
      <button class="range-btn" data-range="all">Hele perioden</button>
    </div>
    <div id="content"></div>
  </main>
  <div id="footer" class="footer"></div>
</div>
<div id="loadingOverlay" class="loading-overlay"><div class="loading-box">Lagrer…</div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzm3LKUvrT8UC0QIN_NNN-_NE4uIRxtmKYRG9_m8Px0E-wbZjuedTe9OqkatYRzpcqU/exec';
const CACHE_KEY='husarbeid_app_cache_v1', PERSON_KEY='husarbeid_selected_person_v1';
let appData=null, selectedPerson=localStorage.getItem(PERSON_KEY)||'', selectedRange='2';
document.addEventListener('DOMContentLoaded',()=>{bindRangeButtons();loadCachedData();fetchFreshData()});
function loadCachedData(){try{const raw=localStorage.getItem(CACHE_KEY);if(!raw)return;const parsed=JSON.parse(raw);if(!parsed||!parsed.people)return;appData=parsed;if(!selectedPerson&&appData.people.length)selectedPerson=appData.people[0].person;render()}catch(e){console.warn(e)}}
function saveCache(data){try{localStorage.setItem(CACHE_KEY,JSON.stringify(data))}catch(e){}}
async function fetchFreshData(){try{const r=await fetch(API_URL+'?action=data&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(!data.ok)throw new Error(data.error||'Ukjent feil');appData=data;saveCache(data);if(!selectedPerson||!appData.people.some(p=>p.person===selectedPerson))selectedPerson=appData.people[0]?.person||'';setOnline(true);render()}catch(e){console.error(e);setOnline(false);if(!appData)document.getElementById('content').innerHTML='<div class="error-box">Kunne ikke hente data akkurat nå. Prøv å laste siden på nytt.</div>'}}
function renderPersonTabs(){const el=document.getElementById('personTabs');if(!appData?.people?.length){el.innerHTML='';return}el.innerHTML=appData.people.map(p=>`<button class="person-tab ${p.person===selectedPerson?'active':''}" data-person="${esc(p.person)}">${esc(p.person)}</button>`).join('');el.querySelectorAll('.person-tab').forEach(b=>b.onclick=()=>{selectedPerson=b.dataset.person;localStorage.setItem(PERSON_KEY,selectedPerson);render()})}
function renderSalaryCard(){const el=document.getElementById('salaryCard'),p=appData.people.find(x=>x.person===selectedPerson);if(!p){el.innerHTML='';return}const m=getCurrentSalaryMonthInfo(p);el.innerHTML=`<div class="salary-head"><div><div class="salary-title">${cap(m.monthName)} · opptjent hittil</div><div class="salary-big">${kr(m.earned)}</div></div><div class="salary-sub">Månedslønn<br><strong>${kr(p.totalMonthlySalary)}</strong></div></div><div class="salary-grid"><div class="metric"><div class="metric-label">Ordinært</div><div class="metric-value">${kr(m.ordinaryEarned)}</div></div><div class="metric"><div class="metric-label">Fast del</div><div class="metric-value">${kr(p.fixedMonthlySalary||0)}</div></div><div class="metric"><div class="metric-label">Til gode</div><div class="metric-value">${kr(m.outstanding)}</div></div></div>`}
function getCurrentSalaryMonthInfo(p){const today=parseYmd(appData.today),y=today.getFullYear(),mo=today.getMonth();const monthWeeks=appData.weeks.filter(w=>{const thu=addDays(parseYmd(w.monday),3);return thu.getFullYear()===y&&thu.getMonth()===mo});const weekly=(p.ordinaryMonthlySalary||0)/4;let ordinary=0;monthWeeks.forEach(w=>{const pw=w.persons.find(x=>x.person===p.person);if(pw?.salaryComplete)ordinary+=weekly});const fixed=p.fixedMonthlySalary||0,earned=ordinary+fixed;const paid=(appData.payments||[]).filter(x=>{if(x.person!==p.person||!x.date)return false;const d=parseYmd(x.date);return d.getFullYear()===y&&d.getMonth()===mo}).reduce((s,x)=>s+Number(x.amount||0),0);return{monthName:new Intl.DateTimeFormat('nb-NO',{month:'long'}).format(today),ordinaryEarned:ordinary,earned,outstanding:Math.max(0,earned-paid)}}
function bindRangeButtons(){document.querySelectorAll('.range-btn').forEach(b=>b.onclick=()=>{selectedRange=b.dataset.range;document.querySelectorAll('.range-btn').forEach(x=>x.classList.toggle('active',x===b));renderWeeks()})}
function getVisibleWeeks(){if(!appData?.weeks)return[];const i=appData.weeks.findIndex(w=>w.year===appData.current.year&&w.week===appData.current.week);if(selectedRange==='all')return appData.weeks;if(i<0)return appData.weeks;if(selectedRange==='2')return appData.weeks.slice(Math.max(0,i-1),i+2);if(selectedRange==='4')return appData.weeks.slice(i,i+4);return appData.weeks}
function renderWeeks(){const el=document.getElementById('content');if(!appData||!selectedPerson){el.innerHTML='<div class="empty">Ingen data tilgjengelig.</div>';return}const weeks=getVisibleWeeks();el.innerHTML=weeks.map(renderWeekCard).join('')||'<div class="empty">Ingen uker å vise.</div>';el.querySelectorAll('[data-task-action]').forEach(b=>b.onclick=()=>updateTaskStatus(Number(b.dataset.year),Number(b.dataset.week),selectedPerson,b.dataset.taskId,b.dataset.done!=='true'))}
function renderWeekCard(w){const pw=w.persons.find(p=>p.person===selectedPerson);if(!pw)return'';const past=isPastWeek(w),complete=pw.salaryComplete,weekly=Number(pw.ordinaryMonthlySalary||0)/4;const tasks=pw.tasks.map(t=>{const meta=[];if(t.comment)meta.push(t.comment);if(!t.affectsSalary)meta.push('Påvirker ikke lønn');if(t.done&&t.doneTimestamp)meta.push('Ferdig '+doneTime(t.doneTimestamp));return `<div class="task-row ${t.done?'done':''}"><div class="task-main"><div class="task-name">${t.done?'✓ ':''}${esc(t.task)}</div>${meta.length?`<div class="task-meta">${meta.map(esc).join(' · ')}</div>`:''}</div><button class="task-action ${t.done?'done':''}" data-task-action data-year="${w.year}" data-week="${w.week}" data-task-id="${esc(t.taskId)}" data-done="${t.done}">${t.done?'Angre':'Ferdig'}</button></div>`}).join('');let note;if(complete)note=`<div class="money-note ok">✓ Ordinær ukesandel opptjent: ${kr(weekly)}</div>`;else{const missing=pw.tasks.filter(t=>t.affectsSalary&&!t.done).map(t=>t.task);note=`<div class="money-note">${missing.length?'For å tjene ukesandelen mangler: '+esc(missing.join(', ')):'Ingen lønnspåvirkende oppgaver denne uken.'}</div>`}return `<section class="week-card ${past?'past':''}"><div class="week-head"><div><div class="week-number">Uke ${w.week}</div><div class="week-dates">${weekRange(w.monday,w.sunday)}</div></div><div class="week-badge ${complete?'complete':''}">${complete?'Lønn opptjent':(past?'Historikk':'Pågår')}</div></div><div class="tasks">${tasks}</div>${note}</section>`}
async function updateTaskStatus(year,week,person,taskId,done){showLoading(true);applyLocalTaskStatus(year,week,person,taskId,done);render();try{const payload={action:'setTaskStatus',year,week,person,taskId,done};const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const data=await r.json();if(!data.ok)throw new Error(data.error||'Kunne ikke lagre');setOnline(true);await fetchFreshData()}catch(e){console.error(e);setOnline(false);alert('Endringen kunne ikke bekreftes av Google Sheet. Siden henter siste lagrede data på nytt.');await fetchFreshData()}finally{showLoading(false)}}
function applyLocalTaskStatus(year,week,person,taskId,done){const w=appData.weeks.find(x=>x.year===year&&x.week===week);if(!w)return;const pw=w.persons.find(x=>x.person===person);if(!pw)return;const t=pw.tasks.find(x=>x.taskId===taskId);if(!t)return;t.done=done;t.doneTimestamp=done?new Date().toISOString():'';const salary=pw.tasks.filter(x=>x.affectsSalary),req=pw.tasks.filter(x=>x.required);pw.salaryComplete=salary.length>0&&salary.every(x=>x.done);pw.weekComplete=req.length>0&&req.every(x=>x.done);saveCache(appData)}
function render(){if(!appData)return;renderPersonTabs();renderSalaryCard();renderWeeks();renderFooter()}
function renderFooter(){const el=document.getElementById('footer'),d=appData?.generatedAt?new Date(appData.generatedAt):null;el.textContent=d?'Sist oppdatert '+d.toLocaleString('nb-NO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}
function setOnline(v){const d=document.getElementById('statusDot');d.classList.toggle('online',v);d.classList.toggle('offline',!v)}function showLoading(v){document.getElementById('loadingOverlay').classList.toggle('show',v)}
function parseYmd(v){const [y,m,d]=String(v).slice(0,10).split('-').map(Number);return new Date(y,m-1,d,12,0,0)}function addDays(date,n){const d=new Date(date);d.setDate(d.getDate()+n);return d}function isPastWeek(w){const today=parseYmd(appData.today),sun=parseYmd(w.sunday);sun.setHours(23,59,59,999);return sun<today}function weekRange(a,b){const f=new Intl.DateTimeFormat('nb-NO',{day:'numeric',month:'short'});return `${f.format(parseYmd(a))} – ${f.format(parseYmd(b))}`}function doneTime(v){const n=String(v).includes('T')?String(v):String(v).replace(' ','T'),d=new Date(n);return isNaN(d)?String(v):d.toLocaleString('nb-NO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}function kr(v){const n=Number(v||0);return new Intl.NumberFormat('nb-NO',{maximumFractionDigits:n%1===0?0:2}).format(n)+' kr'}function cap(v){return v?v.charAt(0).toUpperCase()+v.slice(1):''}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
</script>
</body>
</html>
